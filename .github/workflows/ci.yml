name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - uses: docker/setup-buildx-action@v3

      # The XMage tests run against this image through Testcontainers, so it
      # is built before the tests. The shim's mvn test and the determinism
      # self-test run inside the build. The layer cache keeps the XMage
      # compile (the slow stage) between runs.
      - name: Build XMage sidecar image
        uses: docker/build-push-action@v6
        with:
          context: engine/xmage
          target: runtime
          tags: mtg-archive-xmage:ci
          load: true
          cache-from: type=gha,scope=xmage-sidecar
          cache-to: type=gha,mode=max,scope=xmage-sidecar

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
